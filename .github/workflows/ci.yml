name: ChaosKernel CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Verify FastAPI import and run tests
        env:
          GEMINI_API_KEY: "test-dummy-key"
        run: |
          python -c "from app.main import app; print('App loaded cleanly')"
          pytest
