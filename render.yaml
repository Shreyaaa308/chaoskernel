services:
  - type: web
    name: chaoskernel-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false

workflows:
  - name: chaos-simulation-pipeline
    steps:
      - name: chaos-analysis-and-hardening
        runtime: python
        buildCommand: pip install -r requirements.txt
        startCommand: python -m app.engine.workflow_runner
